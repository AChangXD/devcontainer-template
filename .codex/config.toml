model = "gpt-6-astra"
model_reasoning_effort = "ultra"
approvals_reviewer = "auto_review"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_threads = 12

[features]
memories = true
guardian_approval = true

[plugins."github@openai-curated"]
enabled = true


[tui]
resume_cwd = "current"